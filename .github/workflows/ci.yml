name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Lint
        run: uvx ruff check .
      - name: Test (includes a 24-workflow chaos run)
        run: uv run --python 3.12 --group dev pytest -q
      - name: Chaos invariant gate (60 workflows, 3 workers, SIGKILLs and faults)
        run: uv run --python 3.12 durableflow chaos --workflows 60 --workers 3 --seed 7 --kill-every 1.0 --timeout 300
      - name: Demo data replays deterministically
        run: |
          uv run --python 3.12 durableflow demo --db data/ci.db
          uv run --python 3.12 durableflow replay --db data/ci.db

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: durableflow:ci
      - name: Smoke test server and worker
        run: |
          docker volume create flow
          docker run -d --name server -v flow:/data -p 8000:8000 durableflow:ci server
          docker run -d --name worker -v flow:/data durableflow:ci worker --id ci-worker
          for i in $(seq 1 30); do curl -sf localhost:8000/healthz && break; sleep 1; done
          curl -sf -X POST localhost:8000/api/workflows -H 'content-type: application/json' \
            -d '{"workflow_type":"order_fulfillment","workflow_id":"ci-1","input":{"order_id":"ci-1","sku":"TENT-2","amount_cents":100}}'
          for i in $(seq 1 30); do
            curl -sf localhost:8000/api/workflows/ci-1 | grep -q '"status":"COMPLETED"' && break; sleep 1
          done
          curl -sf localhost:8000/api/workflows/ci-1 | grep '"status":"COMPLETED"'
          curl -sf localhost:8000/metrics | grep durableflow_task_queue_depth
          docker rm -f server worker
      - name: Validate compose file
        run: docker compose config -q
