[project]
name = "durableflow"
version = "1.0.0"
description = "A small durable workflow engine: event-sourced history, deterministic replay, SQLite task queues with leases, durable timers, signals, child workflows, sagas, and a chaos test with invariant checks."
readme = "README.md"
license = "MIT"
authors = [{ name = "Nick Bitzis" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
]

[project.scripts]
durableflow = "durableflow.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore:.*httpx.*"]

[tool.ruff]
line-length = 100
target-version = "py311"
